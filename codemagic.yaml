workflows:
  ios-debug-ipa:
    name: Sprout iOS (debug ipa, unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
        BUNDLE_ID: "com.transcard.ios"
      xcode: 16.0
      cocoapods: default
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/Library/Caches/Homebrew
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "main"
          include: true
        - pattern: "ios-build"
          include: true
    scripts:
      - name: Set up Yandex API key
        script: |
          if [ -n "$YANDEX_DICT_KEY" ]; then
            echo "yandex.dict.key=$YANDEX_DICT_KEY" >> $CM_BUILD_DIR/local.properties
            KEY_LEN=${#YANDEX_DICT_KEY}
            echo "Yandex key present in env (length: $KEY_LEN). Written to local.properties."
          else
            echo "WARN: YANDEX_DICT_KEY env var is empty — online translations will NOT work in the .ipa."
          fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> $CM_BUILD_DIR/local.properties || true
      - name: Generate Gradle wrapper
        script: |
          cd $CM_BUILD_DIR
          if [ ! -f gradlew ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.10-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.10/bin/gradle wrapper --gradle-version 8.10 --distribution-type all
          fi
          chmod +x ./gradlew
          ./gradlew --version
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR/iosApp
          xcodegen generate
      - name: Build unsigned .ipa
        script: |
          cd $CM_BUILD_DIR/iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build
      - name: Package .ipa
        script: |
          cd $CM_BUILD_DIR/iosApp/build/Build/Products/Release-iphoneos
          APP_DIR=$(ls -d *.app | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "No .app found in build output"
            exit 1
          fi
          echo "Packaging $APP_DIR into Sprout.ipa"
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -qr $CM_BUILD_DIR/Sprout.ipa Payload
          rm -rf Payload
    artifacts:
      - Sprout.ipa
      - iosApp/build/Build/Products/Release-iphoneos/*.app
      - shared/build/reports/**/*
